<!doctype html>
<html lang="de">
<head>

  <title>Weiterleitung zu den BDA Live-Demos</title>

      text-align:center;padding:24px

    main{
      max-width:620px;padding:34px;border:1px solid #173750;border-radius:24px;

      background:linear-gradient(135deg,#00d7ff,#57f5e9);
      color:#001018;text-decoration:none;font-weight:900
    }
  </style>
  <script>
    window.location.replace("https://barrydataanalytics.de/projekt-demo-live/demo/");
  </script>
</head>
<body>
  <main>
    <h1>BDA Live-Demos</h1>
    <p>Sie werden automatisch zum Demo-Center weitergeleitet.</p>
